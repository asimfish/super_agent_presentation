name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install validation-only test dependency
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Compile Python
        run: python -m compileall -q scripts skills/agentic-reporting/scripts tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Evaluation harness smoke
        run: python scripts/presentation_benchmark.py smoke
      - name: Route bundle smoke
        run: >-
          python skills/agentic-reporting/scripts/reportctl.py bundle
          --task "five-seed experiment with a result table"
          --mode experiment-report --module tables --max-chars 16000
          > /tmp/agentic-reporting-bundle.md
      - name: Distribution reproducibility
        run: |
          SAP_DIST_CHECK="$(mktemp -d)"
          python skills/agentic-reporting/scripts/reportctl.py build-dist \
            --output "$SAP_DIST_CHECK" --force
          diff -qr dist "$SAP_DIST_CHECK"
