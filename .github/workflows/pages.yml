name: pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "examples/showcase-20260825/html/deck.html"
      - "examples/showcase-20260825/render/*.png"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble static site from committed artifacts
        run: |
          mkdir -p _site/assets
          cp site/index.html _site/index.html
          cp examples/showcase-20260825/html/deck.html _site/deck.html
          cp examples/showcase-20260825/render/contact-sheet.png _site/assets/
          cp examples/showcase-20260825/render/slide-2.png _site/assets/
          cp examples/showcase-20260825/render/slide-3.png _site/assets/
          cp examples/showcase-20260825/render/slide-6.png _site/assets/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
