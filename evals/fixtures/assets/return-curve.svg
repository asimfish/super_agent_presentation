<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Mean return by training step</title>
  <desc id="desc">Mean return rises from step zero through step eighty, then drops at step ninety. A shaded band represents one standard deviation over five seeds.</desc>
  <rect width="720" height="420" fill="#ffffff"/>
  <line x1="80" y1="350" x2="680" y2="350" stroke="#222" stroke-width="2"/>
  <line x1="80" y1="50" x2="80" y2="350" stroke="#222" stroke-width="2"/>
  <text x="355" y="400" text-anchor="middle" font-family="sans-serif" font-size="18">Training step</text>
  <text x="20" y="205" text-anchor="middle" font-family="sans-serif" font-size="18" transform="rotate(-90 20 205)">Mean return</text>
  <path d="M80 320 L140 297 L200 272 L260 242 L320 208 L380 174 L440 145 L500 120 L560 96 L620 190 L680 175 L680 225 L620 240 L560 136 L500 158 L440 183 L380 214 L320 246 L260 280 L200 310 L140 333 L80 348 Z" fill="#8ecae6" opacity="0.45"/>
  <polyline points="80,334 140,315 200,291 260,261 320,227 380,194 440,164 500,139 560,116 620,215 680,199" fill="none" stroke="#005f73" stroke-width="4"/>
  <circle cx="560" cy="116" r="5" fill="#005f73"/>
  <circle cx="620" cy="215" r="5" fill="#005f73"/>
  <text x="554" y="88" text-anchor="middle" font-family="sans-serif" font-size="14">step 80</text>
  <text x="624" y="260" text-anchor="middle" font-family="sans-serif" font-size="14">step 90</text>
</svg>
